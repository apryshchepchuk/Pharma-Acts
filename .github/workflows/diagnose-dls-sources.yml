name: Diagnose DLS Project Sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Diagnose DLS sources
        run: python scripts/diagnose_dls_sources.py

      - name: Add report to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f diagnostics/diagnose_dls_sources.md ]]; then
            cat diagnostics/diagnose_dls_sources.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Діагностичний звіт не створено" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-source-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
